<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="prefixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="randGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1 L6.5,4 L1.5,7" fill="none" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1 L6.5,4 L1.5,7" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1 L6.5,4 L1.5,7" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1 L6.5,4 L1.5,7" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAxis" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1 L6.5,4 L1.5,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1100" height="640" fill="url(#bg)"/>

  <text x="550" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Распределение UUIDv8-ключей</text>

  <g transform="translate(90, 58)">
    <text x="0" y="-8" font-size="14" font-weight="600" fill="#334155">Структура UUIDv8 (MSB + LSB)</text>
    <rect x="0" y="0" width="920" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <rect x="12" y="12" width="92" height="30" rx="6" fill="url(#prefixGrad)"/>
    <text x="58" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Префикс</text>
    <text x="58" y="50" text-anchor="middle" font-size="10" fill="#64748b">10 бит</text>
    <rect x="112" y="12" width="168" height="30" rx="6" fill="url(#tsGrad)"/>
    <text x="196" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Метка времени</text>
    <text x="196" y="50" text-anchor="middle" font-size="10" fill="#64748b">30 бит (секунды)</text>
    <rect x="288" y="12" width="120" height="30" rx="6" fill="url(#randGrad)"/>
    <text x="348" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Случайн.</text>
    <text x="348" y="50" text-anchor="middle" font-size="10" fill="#64748b">MSB</text>
    <rect x="416" y="12" width="492" height="30" rx="6" fill="url(#randGrad)"/>
    <text x="662" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Случайная часть LSB (64 бита)</text>
    <text x="940" y="32" font-size="11" fill="#94a3b8">v8</text>
  </g>

  <g transform="translate(90, 148)">
    <rect x="0" y="0" width="210" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1d4ed8">prefix = 0x2A1</text>
    <text x="14" y="42" font-size="11" fill="#334155">ts = 2024-03-15 10:00</text>
    <text x="14" y="56" font-size="10" fill="#64748b">+ случайный суффикс</text>
    <rect x="230" y="0" width="210" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="244" y="24" font-size="12" font-weight="700" fill="#1d4ed8">prefix = 0x2A1</text>
    <text x="244" y="42" font-size="11" fill="#334155">ts = 2024-03-15 10:05</text>
    <text x="244" y="56" font-size="10" fill="#64748b">+ случайный суффикс</text>
    <rect x="460" y="0" width="210" height="58" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="474" y="24" font-size="12" font-weight="700" fill="#c2410c">prefix = 0x7F3</text>
    <text x="474" y="42" font-size="11" fill="#334155">ts = 2024-03-15 10:02</text>
    <text x="474" y="56" font-size="10" fill="#64748b">+ случайный суффикс</text>
    <rect x="690" y="0" width="210" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="704" y="24" font-size="12" font-weight="700" fill="#6d28d9">prefix = 0x1C8</text>
    <text x="704" y="42" font-size="11" fill="#334155">ts = 2024-03-16 08:30</text>
    <text x="704" y="56" font-size="10" fill="#64748b">+ случайный суффикс</text>
  </g>

  <path d="M 550 222 L 550 242" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g transform="translate(70, 258)">
    <rect x="0" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="14" width="180" height="14" fill="#e2e8f0"/>
    <text x="90" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Партиция P1</text>
    <text x="90" y="48" text-anchor="middle" font-size="11" fill="#64748b">prefix ~ 0x1C8</text>
    <rect x="18" y="62" width="144" height="16" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="90" y="74" text-anchor="middle" font-size="10" fill="#6d28d9">1 ключ</text>
    <rect x="200" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <rect x="200" y="0" width="180" height="28" rx="10" fill="#dbeafe"/>
    <rect x="200" y="14" width="180" height="14" fill="#dbeafe"/>
    <text x="290" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Партиция P2</text>
    <text x="290" y="48" text-anchor="middle" font-size="11" fill="#64748b">prefix ~ 0x2A1</text>
    <rect x="218" y="58" width="144" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="218" y="78" width="144" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="290" y="98" text-anchor="middle" font-size="10" fill="#1d4ed8">2 ключа</text>
    <rect x="400" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
    <rect x="400" y="0" width="180" height="28" rx="10" fill="#ffedd5"/>
    <rect x="400" y="14" width="180" height="14" fill="#ffedd5"/>
    <text x="490" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Партиция P3</text>
    <text x="490" y="48" text-anchor="middle" font-size="11" fill="#64748b">prefix ~ 0x7F3</text>
    <rect x="418" y="62" width="144" height="16" rx="4" fill="#ffedd5" stroke="#fdba74"/>
    <text x="490" y="74" text-anchor="middle" font-size="10" fill="#c2410c">1 ключ</text>
    <rect x="600" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="6 4"/>
    <text x="690" y="58" text-anchor="middle" font-size="28" fill="#cbd5e1">...</text>
    <text x="690" y="88" text-anchor="middle" font-size="11" fill="#94a3b8">до 2^10 ~ 1024</text>
    <text x="690" y="104" text-anchor="middle" font-size="11" fill="#94a3b8">партиций</text>
    <rect x="800" y="0" width="180" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="6 4"/>
    <text x="890" y="58" text-anchor="middle" font-size="28" fill="#cbd5e1">...</text>
    <text x="890" y="88" text-anchor="middle" font-size="11" fill="#94a3b8">Pn</text>
    <path d="M 794 66 C 794 120, 160 120, 160 104" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowPurple)"/>
    <path d="M 335 66 C 335 120, 380 120, 380 104" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
    <path d="M 335 46 C 335 120, 380 120, 380 104" fill="none" stroke="#2563eb" stroke-width="1.6" opacity="0.45"/>
    <path d="M 565 66 C 565 120, 580 120, 580 104" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  </g>

  <path d="M 550 392 L 550 412" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g transform="translate(170, 428)">
    <rect x="0" y="0" width="760" height="158" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="760" height="34" rx="14" fill="#dbeafe"/>
    <rect x="0" y="18" width="760" height="16" fill="#dbeafe"/>
    <text x="380" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Увеличение: партиция P2 (prefix = 0x2A1) - ключи упорядочены по времени</text>
    <line x1="40" y1="118" x2="720" y2="118" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrowAxis)"/>
    <text x="730" y="122" font-size="11" fill="#64748b">время</text>
    <rect x="70" y="52" width="180" height="58" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Блок T1</text>
    <text x="160" y="86" text-anchor="middle" font-size="10" fill="#334155">10:00:00 - 10:04:59</text>
    <rect x="88" y="92" width="144" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="160" y="102" text-anchor="middle" font-size="9" fill="#1d4ed8">ключ A (10:00)</text>
    <rect x="290" y="52" width="180" height="58" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="380" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Блок T2</text>
    <text x="380" y="86" text-anchor="middle" font-size="10" fill="#334155">10:05:00 - 10:09:59</text>
    <rect x="308" y="92" width="144" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="380" y="102" text-anchor="middle" font-size="9" fill="#1d4ed8">ключ B (10:05)</text>
    <rect x="510" y="52" width="180" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="600" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Блок T3</text>
    <text x="600" y="86" text-anchor="middle" font-size="10" fill="#94a3b8">следующий интервал</text>
    <text x="600" y="102" text-anchor="middle" font-size="9" fill="#94a3b8">(пока пуст)</text>
    <line x1="70" y1="114" x2="70" y2="122" stroke="#64748b"/>
    <line x1="250" y1="114" x2="250" y2="122" stroke="#64748b"/>
    <line x1="470" y1="114" x2="470" y2="122" stroke="#64748b"/>
    <line x1="690" y1="114" x2="690" y2="122" stroke="#64748b"/>
    <text x="70" y="138" text-anchor="middle" font-size="10" fill="#64748b">10:00</text>
    <text x="250" y="138" text-anchor="middle" font-size="10" fill="#64748b">10:05</text>
    <text x="470" y="138" text-anchor="middle" font-size="10" fill="#64748b">10:10</text>
    <text x="690" y="138" text-anchor="middle" font-size="10" fill="#64748b">10:15</text>
  </g>

  <g transform="translate(90, 608)">
    <rect x="0" y="-12" width="14" height="14" rx="3" fill="url(#prefixGrad)"/>
    <text x="22" y="0" font-size="11" fill="#475569">Префикс &#8594; выбор партиции</text>
    <rect x="220" y="-12" width="14" height="14" rx="3" fill="url(#tsGrad)"/>
    <text x="242" y="0" font-size="11" fill="#475569">Метка времени &#8594; блоки внутри партиции</text>
    <rect x="520" y="-12" width="14" height="14" rx="3" fill="url(#randGrad)"/>
    <text x="542" y="0" font-size="11" fill="#475569">Случайные биты &#8594; уникальность ключей</text>
  </g>
</svg>
